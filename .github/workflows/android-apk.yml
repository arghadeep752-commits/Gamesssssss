# Builds an installable Android APK on GitHub's servers, so no computer is
# needed: push this project to GitHub (or press "Run workflow" on the Actions
# tab) and download the APK from the Releases page when it finishes.
name: Build Android APK

on:
  push:
    branches: [main, master, arrow-flow]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align native module versions with the Expo SDK
        run: npx expo install --fix

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (engine, solver, sessions, saves)
        run: npm test

      - name: Validate all levels and daily puzzles
        run: npm run levels:validate

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Report native module setup
        run: |
          npm ls expo-asset --all 2>/dev/null | head -20 > modules.txt || true
          (npx expo-modules-autolinking resolve --platform android --json > autolink.json) 2>autolink.err || true
          python3 - <<'PY'
          import json, os
          lines = open('modules.txt').read().strip().splitlines()
          try:
              data = json.load(open('autolink.json'))
              for i, m in enumerate(data.get('modules', [])):
                  pubs = [p.get('publication') for p in m.get('projects', []) if p.get('publication')]
                  lines.append(f"[{i}] {m.get('packageName')} {m.get('packageVersion')} publication={json.dumps(pubs) if pubs else '-'}")
          except Exception as e:
              lines.append('autolink resolve failed: ' + str(e) + ' ' + open('autolink.err').read()[-800:])
          text = '\n'.join(lines)[-3500:]
          print('::warning title=Native modules::' + text.replace('%', '%25').replace('\n', '%0A'))
          PY

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle.log

      # Surfaces the key Gradle errors as run annotations, readable without the full log.
      - name: Report build errors
        if: failure()
        run: |
          [ -f gradle.log ] || exit 0
          python3 - <<'PY'
          import re
          log = open('gradle.log', errors='replace').read().splitlines()
          keep = []
          for i, line in enumerate(log):
              if 'What went wrong' in line:
                  keep += log[i:i + 30]
          keep += [l for l in log if re.search(r'(^e: |error:|ERROR|FAILED|Could not|Unresolved|not found)', l)][:80]
          text = '\n'.join(dict.fromkeys(keep))[-14000:]
          for i in range(0, len(text), 3500):
              chunk = text[i:i + 3500].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title=Gradle {i // 3500 + 1}::{chunk}')
          PY

      - name: Collect APK
        id: apk
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ArrowFlow-${{ github.run_number }}.apk"
          SIZE=$(du -h dist/*.apk | cut -f1)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "### Arrow Flow APK: $SIZE" >> "$GITHUB_STEP_SUMMARY"
          unzip -l dist/*.apk | sort -k1 -n -r | head -25 >> "$GITHUB_STEP_SUMMARY"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$ANDROID_HOME/build-tools/$BT/aapt" dump permissions dist/*.apk >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ArrowFlow-apk-${{ github.run_number }}
          path: dist/*.apk

      - name: Publish as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arrow-flow-build-${{ github.run_number }}
          name: Arrow Flow build ${{ github.run_number }} (${{ steps.apk.outputs.size }})
          body: Installable test build of Arrow Flow. Download the APK below on your Android phone and open it to install.
          files: dist/*.apk
          prerelease: true
