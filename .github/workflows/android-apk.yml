# Builds an installable Android APK on GitHub's servers, so no computer is needed,
# and smoke-tests a QA build on an Android emulator (screenshots + crash check).
name: Build Arrow Flow APK

on:
  push:
    branches: [arrow-flow-v2, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align native module versions with the Expo SDK
        run: npx expo install --fix

      - name: Unit tests (rules, generator, 300 packed levels, a year of dailies)
        run: npm test

      - name: Type-check (report only)
        continue-on-error: true
        run: npm run typecheck

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle.log

      # Surfaces the key Gradle errors as run annotations, readable without the full log.
      - name: Report build errors
        if: failure()
        run: |
          [ -f gradle.log ] || exit 0
          python3 - <<'PY'
          import re
          log = open('gradle.log', errors='replace').read().splitlines()
          keep = []
          for i, line in enumerate(log):
              if 'What went wrong' in line:
                  keep += log[i:i + 30]
          keep += [l for l in log if re.search(r'(^e: |error:|ERROR|FAILED|Could not|Unresolved|not found)', l)][:80]
          text = '\n'.join(dict.fromkeys(keep))[-14000:]
          for i in range(0, len(text), 3500):
              chunk = text[i:i + 3500].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title=Gradle {i // 3500 + 1}::{chunk}')
          PY

      - name: Collect APK
        id: apk
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ArrowFlow-v3-${{ github.run_number }}.apk"
          SIZE=$(du -h dist/*.apk | cut -f1)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "### Arrow Flow APK: $SIZE (versionCode ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging dist/*.apk | grep -E "^package|sdkVersion|targetSdk" >> "$GITHUB_STEP_SUMMARY" || true
          "$ANDROID_HOME/build-tools/$BT/aapt" dump permissions dist/*.apk >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ArrowFlow-v3-apk-${{ github.run_number }}
          path: dist/*.apk

      - name: Publish as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arrow-flow-v3-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Arrow Flow v3 build ${{ github.run_number }} (${{ steps.apk.outputs.size }})
          body: Installable build of Arrow Flow v3. Open this page on your Android phone, tap the APK below and install it.
          files: dist/*.apk
          prerelease: true

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_QA: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund && npx expo install --fix

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build QA APK for the emulator (x86_64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play through the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/scripts/smoke.sh android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ github.run_number }}
          path: smoke-out/

      # Draft releases are visible only to the repo owner; used to review the screenshots.
      - name: Pack QA screenshots
        if: always()
        run: cd smoke-out && zip -q -r ../qa-screenshots.zip . || true

      - name: Attach QA screenshots to a private draft release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arrow-flow-qa-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: QA screenshots ${{ github.run_number }} (private draft)
          body: Emulator screenshots and logs from the automated smoke test. Safe to delete.
          draft: true
          files: qa-screenshots.zip
