name: Android APKs

# Builds both apps from source (expo prebuild + Gradle), signs them, verifies the
# APKs, smoke-tests them on an Android emulator and — when Firebase is connected —
# publishes them as a GitHub release you can download straight to a phone.

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/ci/**'
      - 'config/**'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      apps:
        description: Apps to build
        type: choice
        options: [both, user, admin]
        default: both
      smoke_test:
        description: Run the emulator smoke test
        type: boolean
        default: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  VERSION_NAME: 1.0.0

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      configured: ${{ steps.cfg.outputs.configured }}
      project_id: ${{ steps.cfg.outputs.project_id }}
      project_number: ${{ steps.cfg.outputs.project_number }}
      version_code: ${{ steps.cfg.outputs.version_code }}
      tag: ${{ steps.cfg.outputs.tag }}
      matrix: ${{ steps.cfg.outputs.matrix }}
      smoke: ${{ steps.cfg.outputs.smoke }}
      user_app_id: ${{ steps.firebase.outputs.user_app_id }}
      admin_app_id: ${{ steps.firebase.outputs.admin_app_id }}
      sha256: ${{ steps.firebase.outputs.sha256 }}
      google_sign_in: ${{ steps.firebase.outputs.google_sign_in }}
    steps:
      - uses: actions/checkout@v7

      - name: Read build configuration
        id: cfg
        run: |
          PROJECT_ID="$(jq -r '.projectId // ""' config/firebase-project.json)"
          PROJECT_NUMBER="$(jq -r '.projectNumber // ""' config/firebase-project.json)"
          if [ -n "$PROJECT_ID" ] && [ -n "$PROJECT_NUMBER" ]; then CONFIGURED=true; else CONFIGURED=false; fi
          CODE=$(( ${{ github.run_number }} + 100 ))
          case "${{ github.event.inputs.apps || 'both' }}" in
            user) MATRIX='["user"]' ;;
            admin) MATRIX='["admin"]' ;;
            *) MATRIX='["user","admin"]' ;;
          esac
          {
            echo "configured=$CONFIGURED"
            echo "project_id=$PROJECT_ID"
            echo "project_number=$PROJECT_NUMBER"
            echo "version_code=$CODE"
            echo "tag=v${VERSION_NAME}-build.${CODE}"
            echo "matrix=$MATRIX"
            echo "smoke=${{ github.event.inputs.smoke_test || 'true' }}"
          } >> "$GITHUB_OUTPUT"
          if [ "$CONFIGURED" = true ]; then
            echo "Building against Firebase project **$PROJECT_ID** (version code $CODE)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Firebase is not connected yet: building **test APKs** with a placeholder config (version code $CODE)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Authenticate to Google Cloud
        if: steps.cfg.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ steps.cfg.outputs.project_number }}/locations/global/workloadIdentityPools/github/providers/devdarshan
          service_account: devdarshan-ci@${{ steps.cfg.outputs.project_id }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.cfg.outputs.configured == 'true'

      - uses: actions/setup-node@v7
        if: steps.cfg.outputs.configured == 'true'
        with:
          node-version: 22

      - name: Signing key, Firebase apps and fingerprints
        id: firebase
        if: steps.cfg.outputs.configured == 'true'
        run: bash scripts/ci/firebase-prepare.sh "${{ steps.cfg.outputs.project_id }}"

      - name: Create draft release
        if: steps.cfg.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.cfg.outputs.tag }}" --draft --target "$GITHUB_SHA" \
            --title "DevDarshan ${VERSION_NAME} (build ${{ steps.cfg.outputs.version_code }})" --notes "Building…"

  build:
    name: Build ${{ matrix.app }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      DEVDARSHAN_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      DEVDARSHAN_ABI_SPLITS: 'true'
      DEVDARSHAN_MINIFY: 'true'
      APP: ${{ matrix.app }}
      PACKAGE: ${{ matrix.app == 'user' && 'com.devdarshan.wallpapers' || 'com.devdarshan.admin' }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules/@angular || true
          df -h /

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Authenticate to Google Cloud
        if: needs.prepare.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ needs.prepare.outputs.project_number }}/locations/global/workloadIdentityPools/github/providers/devdarshan
          service_account: devdarshan-ci@${{ needs.prepare.outputs.project_id }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        if: needs.prepare.outputs.configured == 'true'

      - name: Install dependencies
        run: |
          set -o pipefail
          mkdir -p "build-output/$APP"
          npm install --no-audit --no-fund 2>&1 | tee "build-output/$APP/npm-install.log"

      - name: Firebase config and signing key
        run: |
          if [ "${{ needs.prepare.outputs.configured }}" = "true" ]; then
            bash scripts/ci/android-inputs.sh "$APP" "${{ needs.prepare.outputs.project_id }}" \
              "${{ matrix.app == 'user' && needs.prepare.outputs.user_app_id || needs.prepare.outputs.admin_app_id }}"
          else
            bash scripts/ci/android-inputs.sh "$APP" "" ""
          fi

      - name: Generate the native Android project (expo prebuild)
        working-directory: apps/${{ matrix.app }}
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee "$GITHUB_WORKSPACE/build-output/$APP/prebuild.log"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles('apps/*/package.json', 'packages/*/package.json', 'packages/native/android/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.app }}-

      - name: Build release APKs
        working-directory: apps/${{ matrix.app }}/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 \
            2>&1 | tee "$GITHUB_WORKSPACE/build-output/$APP/gradle.log"

      - name: Explain a failed build
        if: failure()
        run: |
          for log in npm-install prebuild gradle; do
            f="build-output/$APP/$log.log"
            [ -f "$f" ] && bash scripts/ci/annotate-errors.sh "$f" "$APP $log"
          done
          true

      - name: Verify APKs
        run: bash scripts/ci/collect-apks.sh "$APP" "$VERSION_NAME" "$DEVDARSHAN_VERSION_CODE" "$DEVDARSHAN_BUILD_CHANNEL"

      - name: Enable KVM for the emulator
        if: needs.prepare.outputs.smoke == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test (Android 14)
        if: needs.prepare.outputs.smoke == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash scripts/ci/smoke-test.sh "$(ls build-output/${{ matrix.app }}/*-x86_64*.apk | head -n1)" "${{ env.PACKAGE }}" "${{ matrix.app }}" "build-output/${{ matrix.app }}/smoke-test"

      - name: Smoke test summary
        if: always() && needs.prepare.outputs.smoke == 'true'
        run: |
          if [ -f "build-output/$APP/smoke-test/results.md" ]; then
            { echo "### Emulator smoke test: $APP"; cat "build-output/$APP/smoke-test/results.md"; } >> "$GITHUB_STEP_SUMMARY"
            body="$(grep -v 'screenshot:' "build-output/$APP/smoke-test/results.md" | head -c 12000 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::notice title=Smoke test results ($APP)::$body"
          fi

      - name: Publish CI evidence to the devdarshan-ci branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: bash scripts/ci/publish-diagnostics.sh "$APP"

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devdarshan-${{ matrix.app }}-${{ needs.prepare.outputs.version_code }}
          path: build-output/${{ matrix.app }}
          if-no-files-found: warn
          retention-days: 30

      - name: Attach APKs to the draft release
        if: success() && needs.prepare.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "build-output/$APP"
          cp report.md "report-$APP.md"
          [ -f smoke-test/results.md ] && cp smoke-test/results.md "smoke-$APP.md" || true
          files=$(ls *.apk | grep -v x86_64)
          gh release upload "${{ needs.prepare.outputs.tag }}" $files "report-$APP.md" $( [ -f "smoke-$APP.md" ] && echo "smoke-$APP.md" ) --clobber

  publish:
    name: Publish release
    needs: [prepare, build]
    if: always() && needs.prepare.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish (or discard) the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            gh release delete "$TAG" --yes --cleanup-tag || true
            echo "Build failed; the draft release was discarded." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir notes && cd notes
          gh release download "$TAG" -p 'report-*.md' -p 'smoke-*.md' || true
          {
            echo "## Install"
            echo
            echo "On your phone, download the APK and open it (allow installs from your browser when Android asks)."
            echo
            echo "- **DevDarshan** (users): \`DevDarshan-${VERSION_NAME}-arm64-v8a.apk\` for almost all phones; \`armeabi-v7a\` for older 32-bit phones; \`universal\` if unsure."
            echo "- **DevDarshan Admin**: \`DevDarshan-Admin-${VERSION_NAME}-arm64-v8a.apk\`."
            echo
            echo "Signing certificate SHA-256: \`${{ needs.prepare.outputs.sha256 }}\` · Google sign-in: **${{ needs.prepare.outputs.google_sign_in }}**"
            echo
            for f in report-*.md; do [ -f "$f" ] && cat "$f" && echo; done
            for f in smoke-*.md; do
              [ -f "$f" ] || continue
              name="${f#smoke-}"; name="${name%.md}"
              echo "### Emulator smoke test: $name"; echo; cat "$f"; echo
            done
          } > notes.md
          for f in report-*.md smoke-*.md; do [ -f "$f" ] && gh release delete-asset "$TAG" "$f" --yes || true; done
          gh release edit "$TAG" --draft=false --latest --notes-file notes.md
          echo "Published release $TAG" >> "$GITHUB_STEP_SUMMARY"
