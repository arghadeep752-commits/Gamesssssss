name: Build APK

# Builds the Calc Pro release APK on GitHub's servers and publishes it to the
# "calcpro-builds" branch right away, so it can be downloaded from a phone.
# Then it checks the app on an Android emulator (screenshots, a screen
# recording, frame statistics and the log) and adds those results to the same
# branch. Runs on every push to the calcpro branch, or manually from the
# Actions tab ("Run workflow").

on:
  push:
    branches: [calcpro, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        # Test results show in the log; a test-environment problem never blocks the APK.
        continue-on-error: true
        run: npx jest --ci

      - name: Build release APK (phones)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.CALCPRO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CALCPRO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CALCPRO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CALCPRO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            export ORG_GRADLE_PROJECT_CALCPRO_UPLOAD_STORE_FILE="$RUNNER_TEMP/release.keystore"
            export ORG_GRADLE_PROJECT_CALCPRO_UPLOAD_STORE_PASSWORD="$KEYSTORE_PASSWORD"
            export ORG_GRADLE_PROJECT_CALCPRO_UPLOAD_KEY_ALIAS="$KEY_ALIAS"
            export ORG_GRADLE_PROJECT_CALCPRO_UPLOAD_KEY_PASSWORD="$KEY_PASSWORD"
            echo "Signing with your release key."
          else
            echo "No signing secrets set, signing with the debug key."
          fi
          ./gradlew assembleRelease --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/CalcPro.apk
          ls -lh ../dist

      - name: Publish the APK to the calcpro-builds branch
        # The finished APK goes out before the emulator test, so it can be
        # downloaded right away. The last step publishes it again with the
        # test results.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash scripts/publish-build.sh

      - name: Build emulator APK (x86_64) for the smoke test
        id: emu_apk
        continue-on-error: true
        working-directory: android
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64
          mkdir -p ../dist-emu
          cp app/build/outputs/apk/release/app-release.apk ../dist-emu/CalcPro-x86_64.apk

      - name: Enable KVM
        if: steps.emu_apk.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an Android emulator
        if: steps.emu_apk.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/smoke-test.sh dist-emu/CalcPro-x86_64.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: CalcPro-build-${{ github.run_number }}
          path: |
            dist/
            smoke/
          if-no-files-found: ignore

      - name: Add the smoke test results to the calcpro-builds branch
        if: always() && hashFiles('dist/CalcPro.apk') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash scripts/publish-build.sh
