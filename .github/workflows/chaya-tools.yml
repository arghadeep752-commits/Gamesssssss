name: Chaya - build tools (private draft)

on:
  push:
    branches: [chaya-tools]

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  park:
    if: contains(github.event.head_commit.message, '[park]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chaya
      - name: Blender 4.2.3 LTS and the Poly Haven scans (CC0)
        timeout-minutes: 30
        run: |
          mkdir -p park
          V=4.2.3; S=${V%.*}; F=blender-$V-linux-x64.tar.xz
          for u in https://download.blender.org/release/Blender$S/$F \
                   https://mirrors.ocf.berkeley.edu/blender/release/Blender$S/$F \
                   https://ftp.nluug.nl/pub/graphics/blender/release/Blender$S/$F; do
            curl -fsSL --retry 3 --max-time 600 "$u" -o park/$F && break || rm -f park/$F
          done
          python3 tools/fetch_scans.py park/scans > park/scans-log.txt 2>&1 || tail -40 park/scans-log.txt
          tail -5 park/scans-log.txt
          tar -C park -cf park/scans.tar scans
          ls -la park
      - name: Upload to the private draft release
        run: |
          R=$GITHUB_REPOSITORY
          rid=$(gh api "repos/$R/releases?per_page=100" --jq '.[] | select(.tag_name=="chaya-tools") | .id' | head -1)
          if [ -z "$rid" ]; then
            rid=$(gh api -X POST "repos/$R/releases" -f tag_name=chaya-tools -f name="Chaya build tools (private draft - do not publish)" \
                  -F draft=true -f body="Blender and the scanned models for local test builds. Not a game release." --jq .id)
          fi
          for f in park/blender-4.2.3-linux-x64.tar.xz park/scans.tar; do
            n=$(basename $f)
            old=$(gh api "repos/$R/releases/$rid/assets?per_page=100" --jq ".[] | select(.name==\"$n\") | .id")
            [ -n "$old" ] && gh api -X DELETE "repos/$R/releases/assets/$old"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" -T "$f" \
              "https://uploads.github.com/repos/$R/releases/$rid/assets?name=$n" >/dev/null && echo "uploaded $n"
          done

  voice:
    if: contains(github.event.head_commit.message, '[voice]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The Pujari's voice from ElevenLabs (the key is read once, then deleted)
        run: |
          R=$GITHUB_REPOSITORY
          rid=$(gh api "repos/$R/releases?per_page=100" --jq '.[] | select(.tag_name=="chaya-tools") | .id' | head -1)
          kid=$(gh api "repos/$R/releases/$rid/assets?per_page=100" --jq '.[] | select(.name=="el.key") | .id')
          if [ -z "$kid" ]; then echo "::error::no key in the draft"; exit 1; fi
          KEY=$(gh api -H "Accept: application/octet-stream" "repos/$R/releases/assets/$kid" | tr -d '\r\n ')
          echo "::add-mask::$KEY"
          gh api -X DELETE "repos/$R/releases/assets/$kid" && echo "key deleted from the draft"
          python3 voice/eleven_voice.py "$KEY" voice.mp3
          KEY=""
          bash voice/voice_fx.sh voice.mp3 pujari_chalisa.ogg
          for f in voice.mp3 pujari_chalisa.ogg; do
            old=$(gh api "repos/$R/releases/$rid/assets?per_page=100" --jq ".[] | select(.name==\"$f\") | .id")
            [ -n "$old" ] && gh api -X DELETE "repos/$R/releases/assets/$old"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" -T "$f" \
              "https://uploads.github.com/repos/$R/releases/$rid/assets?name=$f" >/dev/null && echo "uploaded $f"
          done

  plan:
    if: contains(github.event.head_commit.message, '[tsr]')
    runs-on: ubuntu-24.04
    outputs:
      tsr: ${{ steps.p.outputs.tsr }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 -c "import json; L=[l.strip() for l in open('ai3d/tsr.txt') if l.strip()]; print('tsr=' + json.dumps(L))" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

  tsr:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.tsr) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: TripoSR on the runner's CPU (MIT licence)
        timeout-minutes: 80
        run: |
          git clone -q --depth 1 https://github.com/VAST-AI-Research/TripoSR
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q omegaconf==2.3.0 einops==0.7.0 transformers==4.35.0 trimesh==4.0.5 "rembg[cpu]" huggingface-hub "imageio[ffmpeg]" xatlas==0.0.9 moderngl==5.10.0 Pillow onnxruntime
          pip install -q scikit-build-core cmake ninja pybind11
          pip install -q --no-build-isolation git+https://github.com/tatsy/torchmcubes.git
          R=$GITHUB_REPOSITORY
          rid=$(gh api "repos/$R/releases?per_page=100" --jq '.[] | select(.tag_name=="chaya-tools") | .id' | head -1)
          mkdir -p pics out
          for n in ${{ matrix.group }}; do
            id=$(gh api "repos/$R/releases/$rid/assets?per_page=100" --paginate --jq ".[] | select(.name==\"ai3d_$n.png\") | .id")
            [ -n "$id" ] && gh api -H "Accept: application/octet-stream" repos/$R/releases/assets/$id > pics/$n.png
          done
          ls -la pics
          xvfb-run -a python ai3d/tsr_run.py pics out ${{ matrix.group }} || true
          cd out && for d in tsr_*; do [ -d "$d" ] && (cd $d && zip -qr ../$d.zip .); done; ls -la
      - name: Upload to the private draft release
        run: |
          R=$GITHUB_REPOSITORY
          rid=$(gh api "repos/$R/releases?per_page=100" --jq '.[] | select(.tag_name=="chaya-tools") | .id' | head -1)
          for f in out/*.zip; do
            n=ai3d_$(basename $f)
            old=$(gh api "repos/$R/releases/$rid/assets?per_page=100" --paginate --jq ".[] | select(.name==\"$n\") | .id")
            [ -n "$old" ] && gh api -X DELETE "repos/$R/releases/assets/$old"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" -T "$f" \
              "https://uploads.github.com/repos/$R/releases/$rid/assets?name=$n" >/dev/null && echo "uploaded $n"
          done

  xferkey:
    if: contains(github.event.head_commit.message, '[xferkey]')
    runs-on: ubuntu-24.04
    steps:
      - name: A transfer key kept only in the private draft (encrypts download links committed to this public branch)
        run: |
          R=$GITHUB_REPOSITORY
          rid=$(gh api "repos/$R/releases?per_page=100" --jq '.[] | select(.tag_name=="chaya-tools") | .id' | head -1)
          old=$(gh api "repos/$R/releases/$rid/assets?per_page=100" --paginate --jq '.[] | select(.name=="xfer.key") | .id')
          if [ -z "$old" ]; then
            openssl rand -hex 32 > xfer.key
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" -T xfer.key \
              "https://uploads.github.com/repos/$R/releases/$rid/assets?name=xfer.key" >/dev/null && echo "transfer key stored"
          else
            echo "transfer key already there"
          fi

  fetch:
    if: contains(github.event.head_commit.message, '[fetch]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download the generated 3D models into the private draft
        run: |
          R=$GITHUB_REPOSITORY
          rid=$(gh api "repos/$R/releases?per_page=100" --jq '.[] | select(.tag_name=="chaya-tools") | .id' | head -1)
          kid=$(gh api "repos/$R/releases/$rid/assets?per_page=100" --paginate --jq '.[] | select(.name=="xfer.key") | .id')
          gh api -H "Accept: application/octet-stream" repos/$R/releases/assets/$kid > xfer.key
          openssl enc -d -aes-256-cbc -pbkdf2 -a -pass file:xfer.key -in rodin/fetch.enc -out fetch.json
          rm -f xfer.key
          mkdir -p out
          python3 - <<'PY'
          import json, urllib.request
          for name, url in json.load(open("fetch.json")).items():
              data = urllib.request.urlopen(url, timeout=300).read()
              open("out/" + name, "wb").write(data)
              print(name, len(data), "bytes")
          PY
          rm -f fetch.json
          for f in out/*; do
            n=rodin_$(basename $f)
            old=$(gh api "repos/$R/releases/$rid/assets?per_page=100" --paginate --jq ".[] | select(.name==\"$n\") | .id")
            [ -n "$old" ] && gh api -X DELETE "repos/$R/releases/assets/$old"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" -T "$f" \
              "https://uploads.github.com/repos/$R/releases/$rid/assets?name=$n" >/dev/null && echo "uploaded $n"
          done
