name: Chaya - build APK

on:
  push:
    branches: [chaya]
    paths-ignore:
      - "tools/logo/**"
      - ".github/workflows/chaya-logo.yml"
      - "tools/trailer/**"
      - ".github/workflows/chaya-trailer.yml"
      - "tools/scout/**"
      - ".github/workflows/chaya-scout.yml"
      - "tools/mixamo_fetch.py"
      - "tools/mixamo_clips.json"
      - ".github/workflows/chaya-mixamo.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: 4.6.2-stable
  GH_TOKEN: ${{ github.token }}

jobs:
  init:
    runs-on: ubuntu-24.04
    steps:
      - name: Rolling CI release (logs and previews, not the game)
        run: |
          gh release view chaya-ci -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create chaya-ci -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "CI logs and previews (not the game)" --notes "Build logs of the latest Chaya build."

  # ---------------------------------------------------------------- third-party assets (textures, sounds, fonts, avatar)
  assets:
    needs: init
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache downloaded assets
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            assets/downloaded
            assets/sounds
            build/CREDITS_AUTO.md
            build/textures_contact.jpg
            build/sounds_report.txt
            build/textures_chosen.json
          key: chaya-assets-${{ hashFiles('tools/fetch_assets.py') }}
      - name: Tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-numpy python3-pil
      - name: Download assets
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build && touch build/.gdignore
          python3 tools/fetch_assets.py all 2>&1 | tee build/assets-log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: |
            assets/downloaded
            assets/sounds
            build/CREDITS_AUTO.md
          if-no-files-found: error
      - name: Publish reports
        if: always()
        run: |
          mkdir -p build
          for f in build/assets-log.txt build/textures_contact.jpg build/sounds_report.txt build/textures_chosen.json; do
            [ -f "$f" ] && gh release upload chaya-ci "$f" -R "$GITHUB_REPOSITORY" --clobber || true
          done
          ls -la assets/sounds assets/downloaded/tex 2>/dev/null | head -80

  # ---------------------------------------------------------------- the house, built in Blender
  map:
    needs: init
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          blender --version | head -2
      - name: Cache the scanned models (Poly Haven, CC0)
        id: scans
        uses: actions/cache@v4
        with:
          path: assets/downloaded/scans
          key: chaya-scans-${{ hashFiles('tools/fetch_scans.py') }}
      - name: Download the scanned models
        if: steps.scans.outputs.cache-hit != 'true'
        run: |
          mkdir -p build
          python3 tools/fetch_scans.py assets/downloaded/scans 2>&1 | tee build/scans-log.txt
      - name: Layout and Blender build
        run: |
          mkdir -p build map_out
          python3 tools/maze.py map_out/layout.json 11
          blender -b -noaudio -P tools/build_map.py -- map_out/layout.json map_out --scans assets/downloaded/scans > build/map-log.txt 2>&1 || { tail -60 build/map-log.txt; exit 1; }
          grep -E "scan|FAILED|Error|props placed|lantern|pedestal|candle|item |icon|paintings|done in" build/map-log.txt | head -150 || true
          [ -d assets/downloaded/scans/tex ] && cp -r assets/downloaded/scans/tex map_out/scan_tex || true
          [ -f assets/downloaded/scans/CREDITS_SCANS.md ] && cp assets/downloaded/scans/CREDITS_SCANS.md map_out/ || true
          ls -la map_out map_out/icons || true
          du -sh map_out/tex || true
      - uses: actions/upload-artifact@v4
        with:
          name: map
          path: map_out
          if-no-files-found: error
      - name: Publish log and previews
        if: always()
        run: |
          for f in build/map-log.txt build/scans-log.txt map_out/scans_preview.jpg; do
            [ -f "$f" ] && gh release upload chaya-ci "$f" -R "$GITHUB_REPOSITORY" --clobber || true
          done
          for f in map_out/icons/*.png; do [ -f "$f" ] && cp "$f" "build/icon_$(basename $f)" && gh release upload chaya-ci "build/icon_$(basename $f)" -R "$GITHUB_REPOSITORY" --clobber || true; done

  # ---------------------------------------------------------------- Godot import, preview shots, Android export, release
  apk:
    needs: [assets, map]
    if: ${{ !contains(github.event.head_commit.message, '[probe]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: map
          path: map_dl
      - name: Map files into the project (the .blend stays outside it)
        run: |
          mkdir -p assets/map build && touch build/.gdignore
          rm -f assets/map/maze.glb assets/map/maze.glb.import
          cp map_dl/maze.gltf map_dl/maze.bin map_dl/meta.json map_dl/layout.json assets/map/
          [ -d map_dl/tex ] && cp -r map_dl/tex assets/map/tex
          [ -f map_dl/candle.gltf ] && cp map_dl/candle.gltf map_dl/candle.bin assets/map/ || echo "::warning::no candle model (the game uses a simple candle)"
          [ -d map_dl/icons ] && cp -r map_dl/icons assets/map/icons
          [ -d map_dl/scan_tex ] && cp -r map_dl/scan_tex/. assets/downloaded/tex/
          [ -f map_dl/CREDITS_SCANS.md ] && { echo; cat map_dl/CREDITS_SCANS.md; } >> build/CREDITS_AUTO.md
          [ -f map_dl/chaya_map.blend ] && mv map_dl/chaya_map.blend build/chaya_map.blend
          du -sh assets/map/tex || true
          rm -rf map_dl
          ls -la assets/map build
      - name: Chaya's Mixamo clips (the developer's own downloads, kept in a private draft release)
        run: |
          mkdir -p assets/downloaded/chaya/mixamo
          REL=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name=="chaya-mixamo") | .id' | head -1)
          if [ -n "$REL" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$REL/assets?per_page=100" --jq '.[] | "\(.id) \(.name)"' | while read -r id name; do
              case "$name" in *.fbx|*.FBX)
                gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "assets/downloaded/chaya/mixamo/$name" && echo "mixamo clip: $name";;
              esac
            done
          else
            echo "no Mixamo clips yet - Chaya keeps her Rocketbox motion capture"
          fi
          ls -la assets/downloaded/chaya/mixamo
      - name: Godot and export templates
        run: |
          mkdir -p ~/godot build && touch build/.gdignore
          cd ~/godot
          B=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}
          curl -fsSL -o godot.zip $B/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          curl -fsSL -o tpz.zip $B/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q godot.zip && chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          unzip -q tpz.zip && mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}/
          ln -sf ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot 2>/dev/null || sudo ln -sf ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          ls ~/.local/share/godot/export_templates/*/ | head -30
      - name: Import project (twice, VRAM-compress the textures in between)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libegl1 libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64 libfontconfig1 libpulse0 python3-pil
          godot --headless --path . --import 2>&1 | tail -5 || true
          python3 tools/patch_imports.py assets/downloaded
          python3 tools/patch_imports.py assets/map 512
          godot --headless --path . --import 2>&1 | tail -5 || true
          godot --headless --path . --quit 2>&1 | grep -E "SCRIPT ERROR|Parse Error|ERROR" | head -20 || true
          # never publish an APK without the house or Chaya
          ok=1
          for f in maze.gltf Medical_Female_01.fbx walk.fbx run.fbx idle.fbx; do
            ls .godot/imported | grep -q "^$f-" && echo "imported: $f" || { echo "::error::$f was not imported"; ok=0; }
          done
          [ $ok = 1 ]
      - name: Restore the signing key (the same key for every build, so updates install over the old version)
        uses: actions/cache@v4
        with:
          path: ~/.chaya-signing
          key: chaya-signing-key-1
      - name: Android SDK and signing key
        run: |
          export SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" >/dev/null 2>&1 || true
          ls $SDK/build-tools $SDK/platforms
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.6.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          EOT
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.6.tres
          cat ~/.config/godot/editor_settings-4.6.tres
          KS=~/.chaya-signing/chaya.keystore
          mkdir -p ~/.chaya-signing
          if [ ! -s "$KS" ]; then
            # the key is also kept in a private draft release (drafts are visible only to the repo owner and collaborators)
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name=="chaya-signing") | .assets[] | select(.name=="chaya.keystore") | .id' 2>/dev/null | head -1 || true)
            if [ -n "$id" ]; then
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$KS" || rm -f "$KS"
              echo "signing key restored from the private draft release"
            fi
          else
            echo "signing key restored from the cache"
          fi
          if [ ! -s "$KS" ]; then
            echo "creating a new signing key"
            $JAVA_HOME_17_X64/bin/keytool -genkeypair -keystore "$KS" -alias chaya -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass chayamxyan -keypass chayamxyan -dname "CN=mxyan games, O=mxyan games, C=IN"
            rid=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name=chaya-signing -f name="Chaya signing key (private draft - do not publish)" \
                  -F draft=true -f body="Keeps the APK signing key so new Chaya builds install over older ones." --jq .id 2>/dev/null || true)
            if [ -n "$rid" ]; then
              curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @"$KS" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$rid/assets?name=chaya.keystore" >/dev/null \
                && echo "signing key stored in a private draft release" || echo "::warning::could not store the signing key in a draft release"
            else
              echo "::warning::could not create the private draft release for the signing key (it stays in the cache)"
            fi
          fi
          $JAVA_HOME_17_X64/bin/keytool -list -keystore "$KS" -storepass chayamxyan | grep -i fingerprint || true
          cp "$KS" $RUNNER_TEMP/chaya.keystore
      - name: Export APK
        run: |
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/; s/^version\/name=.*/version\/name=\"1.${GITHUB_RUN_NUMBER}\"/" export_presets.cfg
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/chaya.keystore
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=chaya
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=chayamxyan
          godot --headless --path . --export-release Android build/Chaya.apk 2>&1 | tee build/export-log.txt | tail -40
          ls -la build/Chaya.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Chaya-apk
          path: build/Chaya.apk
          if-no-files-found: error
      - name: Publish release
        run: |
          TAG=chaya-v${GITHUB_RUN_NUMBER}
          cp build/Chaya.apk build/Chaya-v${GITHUB_RUN_NUMBER}.apk
          cat > notes.md <<EOT
          # Chaya (build ${GITHUB_RUN_NUMBER}) - by mxyan games

          Download **Chaya-v${GITHUB_RUN_NUMBER}.apk** below and install it on your Android phone (allow "install unknown apps" once).

          - New here? Press TUTORIAL on the main menu: it walks you through the whole game.
          - Controls: joystick (left), run button (right), drag the right side of the screen to look.
          - Find all six pooja items - kalash, diya, coconut, kumkum, kapoor, gangajal - and place them on the altar in the pooja room to destroy Chaya for good.
          - Sensitivity can be changed in Settings.

          ## Credits
          Every sound is a real recording (nothing is AI generated); the furniture, lamps, brass vessels and the candle are real photo-scanned objects and the textures are photographic CC0 scans (Poly Haven).
          Full list: CREDITS.md attached to this release.
          EOT
          sed -i 's/^          //' notes.md
          { echo "# Chaya - credits and licences"; echo; echo "Game by mxyan games."; echo; echo "- Game font: The Friendly Indians (supplied by mxyan games). Logo lettering: Biro Script reduced by ingoFonts, drawn into the logo image (the font file is not included)."; cat build/CREDITS_AUTO.md; } > CREDITS.md
          ASSETS="build/Chaya-v${GITHUB_RUN_NUMBER}.apk CREDITS.md"
          [ -f build/chaya_map.blend ] && ASSETS="$ASSETS build/chaya_map.blend"
          gh --version | head -1
          # Create the (published) release first, then attach the files - the same calls the CI-log release uses.
          set +e
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Chaya v1.${GITHUB_RUN_NUMBER}" --notes-file notes.md
          ok=$?
          if [ $ok -ne 0 ]; then
            echo "::warning::gh release create failed - trying the REST API"
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="Chaya v1.${GITHUB_RUN_NUMBER}" -F body=@notes.md -F draft=false -F prerelease=false --jq .html_url
            ok=$?
          fi
          if [ $ok -ne 0 ]; then
            echo "::warning::REST create failed - pushing the tag with git, then creating the release on it"
            git tag -f "$TAG" "$GITHUB_SHA" && git push -f origin "refs/tags/$TAG" && \
              gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "Chaya v1.${GITHUB_RUN_NUMBER}" --notes-file notes.md
            ok=$?
          fi
          set -e
          if [ $ok -eq 0 ]; then
            gh release upload "$TAG" $ASSETS -R "$GITHUB_REPOSITORY" --clobber
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          else
            echo "::error::could not create the release - the APK is attached to the chaya-ci release instead"
            gh release upload chaya-ci $ASSETS -R "$GITHUB_REPOSITORY" --clobber
            exit 1
          fi
      - name: Preview screenshots (software GL, for the release page)
        continue-on-error: true
        run: |
          mkdir -p shots
          export CHAYA_SHOTS=$PWD/shots
          CHAYA_MENU_SHOT=$PWD/shots timeout 120 xvfb-run -a -s "-screen 0 1600x720x24" godot --rendering-driver opengl3 --resolution 1600x720 --path . 2>&1 | grep -E "SCRIPT ERROR|CHAYA" | head -10 || true
          timeout 480 xvfb-run -a -s "-screen 0 1600x720x24" godot --rendering-driver opengl3 --resolution 1600x720 --path . game/game.tscn 2>&1 | tee build/shots-log.txt | grep -E "SCRIPT ERROR|ERROR: .*gd|Parse Error|Invalid|Nonexistent" | head -40 || true
          ls -la shots
          for f in shots/*.png; do [ -f "$f" ] && gh release upload "chaya-v${GITHUB_RUN_NUMBER}" "$f" -R "$GITHUB_REPOSITORY" --clobber || true; done
      - name: Publish logs
        if: always()
        run: |
          for f in build/export-log.txt build/shots-log.txt; do [ -f "$f" ] && gh release upload chaya-ci "$f" -R "$GITHUB_REPOSITORY" --clobber || true; done
