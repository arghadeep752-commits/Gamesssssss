# Marks an existing Hime release as a normal "Latest" release so it shows at
# the top of the Releases page. Triggered by writing the tag into
# tool/ci/promote.request.
name: Hime promote release

on:
  workflow_dispatch:
  push:
    branches: [hime]
    paths: ['tool/ci/promote.request']

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(tr -d '[:space:]' < tool/ci/promote.request)
          BUILD=${TAG##*.}
          gh release edit "$TAG" --repo "${{ github.repository }}" --prerelease=false --latest \
            --title "Hime 1.0 (build $BUILD) - Android APK"
          gh release view "$TAG" --repo "${{ github.repository }}" --json url,isPrerelease,name
