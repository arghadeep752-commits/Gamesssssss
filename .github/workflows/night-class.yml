# Builds "Night Class" (original first-person school horror game, Unity 6 + URP) into an
# Android APK entirely in the cloud.
#
# One-time setup (repository secrets, Settings > Secrets and variables > Actions):
#   UNITY_EMAIL     your Unity account email
#   UNITY_PASSWORD  your Unity account password (two-step verification must be off)
#
# Every push to the night-class branch downloads the free CC0 textures (Poly Haven) and fonts,
# generates the rest of the art and all sounds, installs Unity 6 (6000.0 LTS), activates a free
# Unity Personal license, builds the APK, publishes it as a GitHub release
# ("night-class-build-<n>") and plays it in an Android emulator to take screenshots.

name: Night Class APK

on:
  push:
    branches: [night-class]
  workflow_dispatch:
    inputs:
      smoke_test:
        description: Run the APK in an Android emulator and capture screenshots
        type: boolean
        default: true

permissions:
  contents: write

# each push gets its own group so a new build never cancels the emulator screenshots of the previous one
concurrency:
  group: night-class-${{ github.sha }}
  cancel-in-progress: false

env:
  UNITY_VERSION: 6000.0.85f1
  KIT_TAG: unity6-kit
  LOGS_TAG: night-class-logs
  GH_REPO: ${{ github.repository }}

jobs:
  compile:
    name: Compile check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Get Unity 6's compiler (private draft)
        id: kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/kit" "$RUNNER_TEMP/parts"
          gh api "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$KIT_TAG\") | .assets[] | select(.name | startswith(\"unity6-kit.tar.xz.part\")) | \"\(.id) \(.name)\"" > "$RUNNER_TEMP/parts.txt" || true
          if [ ! -s "$RUNNER_TEMP/parts.txt" ]; then
            echo "No compile kit yet; the full build will check the code instead."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$id" > "$RUNNER_TEMP/parts/$name"
          done < "$RUNNER_TEMP/parts.txt"
          cat $(ls "$RUNNER_TEMP"/parts/unity6-kit.tar.xz.part* | sort) | tar -xJf - -C "$RUNNER_TEMP/kit"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Compile scripts
        if: steps.kit.outputs.available == 'true'
        run: bash ci/compile_check6.sh "$RUNNER_TEMP/kit" "$GITHUB_WORKSPACE"

  build:
    name: Build APK
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      release_tag: ${{ steps.publish.outputs.tag }}
      apk_name: ${{ steps.publish.outputs.apk }}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift /usr/local/julia* || true
          df -h /

      - uses: actions/checkout@v5

      - name: Check Unity login secrets
        id: login
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "problem=Add repository secrets UNITY_EMAIL and UNITY_PASSWORD (Settings > Secrets and variables > Actions), then run this workflow again." >> "$GITHUB_OUTPUT"
          elif ! printf '%s' "$UNITY_EMAIL" | tr -d '\r\n' | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "problem=The UNITY_EMAIL secret is not a plain email address - check it for extra symbols (like #) or spaces and save it again." >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages for the asset processing
        run: python -m pip install --quiet numpy pillow scipy

      - name: Cache the downloaded CC0 source assets
        id: sources
        uses: actions/cache@v4
        with:
          path: SourceAssets
          key: nc-sources-${{ hashFiles('tools/fetch_assets.py') }}

      - name: Download textures (Poly Haven, CC0) and fonts (OFL)
        if: steps.sources.outputs.cache-hit != 'true'
        run: python tools/fetch_assets.py SourceAssets

      - name: Generate art and sounds
        run: |
          python tools/process_assets.py SourceAssets .
          du -sh Assets/Art

      - name: Install Unity Hub
        run: bash ci/install_hub.sh

      - name: Install Unity ${{ env.UNITY_VERSION }} with Android support
        id: unity
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          version-file: None
          build-targets: Android
          auto-update-hub: false
          cache-installation: true

      - name: Match the project's packages (URP, uGUI) to the editor
        run: |
          mkdir -p Logs
          python3 ci/unity6_manifest.py "$UNITY_EDITOR_PATH" Packages/manifest.json --report Logs/packages.txt
          printf 'm_EditorVersion: %s\n' "$UNITY_VERSION" > ProjectSettings/ProjectVersion.txt
          cat Packages/manifest.json

      - name: Restore Unity's import cache (Library + asset GUIDs)
        id: libcache
        uses: actions/cache/restore@v4
        with:
          path: |
            Library
            !Library/Bee
            !Library/Il2cppBuildCache
            Assets/**/*.meta
          key: nc-library-u6-${{ github.run_number }}
          restore-keys: |
            nc-library-u6-

      - name: Stop if the Unity login secrets are missing or malformed
        if: steps.login.outputs.ready != 'true'
        env:
          PROBLEM: ${{ steps.login.outputs.problem }}
        run: |
          echo "::error title=Unity login needed::$PROBLEM"
          exit 1

      - name: Activate Unity Personal license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Prepare signing key
        id: keystore
        uses: actions/cache@v4
        with:
          path: ci-keystore
          key: night-class-keystore-v1

      - name: Create signing key (first run only)
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ci-keystore
          keytool -genkeypair -noprompt -keystore ci-keystore/nightclass.keystore \
            -alias nightclass -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nightclass -keypass nightclass -dname "CN=Night Class, O=Night Class"

      - name: Build APK with Unity
        env:
          RF_KEYSTORE: ${{ github.workspace }}/ci-keystore/nightclass.keystore
          RF_KEYSTORE_PASS: nightclass
          RF_KEY_ALIAS: nightclass
          # an extra x86_64 APK only for the emulator smoke test (never published)
          TEST_APK_ARG: ${{ (github.event_name == 'push' || inputs.smoke_test) && '-testApk Build/NightClass-emulator.apk' || '' }}
        run: |
          mkdir -p Logs
          # UNITY_THISISABUILDMACHINE makes Unity 6's Android build use Unity's internal (private)
          # Maven mirrors, which are unreachable from GitHub, so it must not reach the editor.
          set +e
          env -u UNITY_THISISABUILDMACHINE timeout 140m "$UNITY_EDITOR_PATH" -quit -batchmode -nographics \
            -projectPath "$GITHUB_WORKSPACE" -buildTarget Android \
            -executeMethod NightClass.EditorTools.NCBuild.BuildAndroid \
            -buildNumber ${{ github.run_number }} $TEST_APK_ARG \
            -logFile "$GITHUB_WORKSPACE/Logs/build.log"
          status=$?
          echo "Unity exited with code $status"
          grep -E "\[RF-BUILD\]|\[RF-ERR\]" Logs/build.log | tail -60 || true
          exit $status

      - name: Save Unity's import cache (also after a failed build)
        if: always() && steps.libcache.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            Library
            !Library/Bee
            !Library/Il2cppBuildCache
            Assets/**/*.meta
          key: nc-library-u6-${{ github.run_number }}

      - name: Check the APK
        run: |
          ls -la Build || true
          test -f Build/NightClass.apk
          unzip -l Build/NightClass.apk | grep -E "lib/|assets/bin/Data/(data.unity3d|globalgamemanagers)" | head -20 || true

      - name: Keep the emulator test APK for the smoke test
        uses: actions/upload-artifact@v4
        with:
          name: emulator-apk
          path: Build/NightClass-emulator.apk
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0

      - name: Publish APK release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="night-class-build-${{ github.run_number }}"
          APK="NightClass-${{ github.run_number }}.apk"
          cp Build/NightClass.apk "$APK"
          printf 'Night Class build %s (Unity %s, commit %s).\n\nDownload the APK below on your Android phone and open it to install.\n\nTextures: Poly Haven (CC0). Fonts: Google Fonts (OFL). Everything else is generated by the build.\n' \
            "${{ github.run_number }}" "$UNITY_VERSION" "${GITHUB_SHA::7}" > notes.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Night Class build ${{ github.run_number }}" --notes-file notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Published release $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the temporary asset-probe drafts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft and ((.tag_name | startswith("night-class-probe")) or (.tag_name | startswith("night-class-sources")))) | .id' \
            | while read -r id; do gh api -X DELETE "repos/$GH_REPO/releases/$id" && echo "deleted draft $id"; done || true

      - name: Report errors and upload logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: python3 ci/report.py --workspace "${{ github.workspace }}" --status "$JOB_STATUS"

  smoke-test:
    name: Smoke test in emulator
    needs: build
    if: ${{ needs.build.outputs.release_tag != '' && (github.event_name == 'push' || inputs.smoke_test) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Download the emulator test APK (x86_64)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: emulator-apk
          path: smoke

      - name: Fall back to the phone APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p smoke
          if ls smoke/*.apk >/dev/null 2>&1; then
            echo "Testing the x86_64 emulator build" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No x86_64 test APK: testing the ARM64 phone APK under ARM translation" | tee -a "$GITHUB_STEP_SUMMARY"
            gh release download "${{ needs.build.outputs.release_tag }}" -p "*.apk" -D smoke
          fi
          ls -la smoke

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the game in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/smoke_test.sh smoke

      - name: Upload screenshots to the release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la smoke || true
          files=$(ls smoke/*.png smoke/*.jpg smoke/*.txt 2>/dev/null || true)
          if [ -n "$files" ]; then
            gh release upload "${{ needs.build.outputs.release_tag }}" $files --clobber
          fi
