name: Ninja Shadow Legacy - Build & Release APK

# Manual, one-tap release: Actions tab -> "Ninja Shadow Legacy - Build & Release APK" -> Run workflow.
# Builds the Godot 4.5.1 project from the `ninja-shadow-legacy` branch and publishes the APK
# on the Releases page (tag ninja-shadow-legacy-v<version>).
# Optional secrets for a stable signing key: NINJA_KEYSTORE_BASE64, NINJA_KEYSTORE_PASSWORD
# (alias "mxyangames"). Without them a fresh key is generated for each run.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "1.0"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GODOT_VERSION: "4.5.1"
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Checkout game source
        uses: actions/checkout@v4
        with:
          ref: ninja-shadow-legacy

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot and Android export templates
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot"
          chmod +x "$HOME/godot"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q -j templates.tpz "templates/android_debug.apk" "templates/android_release.apk" "templates/version.txt" -d "$tpl"
          rm -f templates.tpz "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"

      - name: Configure Android SDK for Godot
        run: |
          set -e
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -storetype JKS
          # first run creates the editor settings file, then point it at the runner's SDK + JDK
          "$HOME/godot" --headless --path . --import || true
          cfg="$HOME/.config/godot/editor_settings-4.5.tres"
          sed -i '/export\/android\/android_sdk_path/d;/export\/android\/java_sdk_path/d;/export\/android\/debug_keystore/d' "$cfg"
          {
            echo "export/android/android_sdk_path = \"$sdk\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
          } >> "$cfg"

      - name: Export APK
        run: |
          set -e
          mkdir -p build
          sed -i "s/^version\/name=.*/version\/name=\"${VERSION}\"/" export_presets.cfg
          "$HOME/godot" --headless --path . --import || true
          "$HOME/godot" --headless --path . --export-release "Android" build/unsigned.apk
          ls -la build

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.NINJA_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.NINJA_KEYSTORE_PASSWORD }}
        run: |
          set -e
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          bt="$sdk/build-tools/$(ls "$sdk/build-tools" | sort -V | tail -1)"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            pass="$KS_PASS"
          else
            pass="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore release.keystore -alias mxyangames -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$pass" -keypass "$pass" -dname "CN=MXYAN GAMES, O=MXYAN GAMES, C=IN" -storetype JKS
          fi
          "$bt/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
          "$bt/apksigner" sign --ks release.keystore --ks-key-alias mxyangames --ks-pass "pass:$pass" --key-pass "pass:$pass" \
            --out "build/NinjaShadowLegacy-v${VERSION}.apk" build/aligned.apk
          "$bt/apksigner" verify --verbose "build/NinjaShadowLegacy-v${VERSION}.apk" | head -5
          rm -f release.keystore

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="ninja-shadow-legacy-v${VERSION}"
          apk="build/NinjaShadowLegacy-v${VERSION}.apk"
          notes="MXYAN GAMES - Ninja: Shadow Legacy v${VERSION} (Android 7+, portrait). Download NinjaShadowLegacy-v${VERSION}.apk below and install it (allow \"install unknown apps\"). Source: branch ninja-shadow-legacy. Art & audio: CC0 assets by pzUH (GameArt2D), Kenney, Pixel-boy & AAA (Ninja Adventure) - see ASSET_CREDITS.md."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target ninja-shadow-legacy --title "Ninja: Shadow Legacy v${VERSION}" --notes "$notes"
          fi
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
