name: Ragini - build

on:
  push:
    branches: [ragini]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  GH_TOKEN: ${{ github.token }}
  BLENDER_VERSION: 4.2.3
  GODOT_VERSION: 4.3

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Which sound libraries answer from GitHub's servers
        run: |
          A="RaginiGameBuild/1.0 (MXYAN GAMES OFFICIAL; contact via github.com/arghadeep752-commits)"
          for u in "https://api.openverse.org/v1/audio/?q=tanpura&license=cc0,by,by-sa&page_size=3" \
                   "https://commons.wikimedia.org/w/api.php?action=query&list=search&srsearch=tanpura&srnamespace=6&format=json" \
                   "https://upload.wikimedia.org/wikipedia/commons/c/c8/Example.ogg" \
                   "https://archive.org/advancedsearch.php?q=tanpura&fl%5B%5D=identifier&rows=3&output=json"; do
            r=$(curl -s -o /tmp/p -w "%{http_code} %{time_total}s" -A "$A" "$u"); echo "== $r  $u"; head -c 700 /tmp/p; echo
          done
          curl -s -A "$A" "https://api.openverse.org/v1/audio/?q=ghungroo&license=cc0,by,by-sa&page_size=3" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(r.get('source'),r.get('license'),r.get('title'),r.get('url')) for r in d.get('results',[])]" || true
          f=$(curl -s -A "$A" "https://api.openverse.org/v1/audio/?q=door%20creak&license=cc0&page_size=1" | python3 -c "import json,sys;print(json.load(sys.stdin)['results'][0]['url'])" 2>/dev/null)
          [ -n "$f" ] && curl -s -o /tmp/f -w "file %{http_code} %{size_download} bytes %{time_total}s  $f\n" -A "$A" "$f"

  # ----------------------------------------------------------------------------------------- real textures, sounds, fonts
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: CI release (logs and previews, not the game)
        run: |
          gh release view ragini-ci -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create ragini-ci -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Ragini CI - logs and previews (not the game)" --notes "Build logs and preview renders of the latest Ragini build."
      - name: Tools
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python3 -c "import numpy, PIL" 2>/dev/null || pip install --break-system-packages -q numpy pillow
      - name: Download real textures, fonts and the night sky
        run: |
          python3 tools/fetch_assets.py textures,sky,fonts assets/downloaded 2>&1 | tee build/assets_log.txt | tail -60
      - name: Real recorded sounds and music (kept between builds, only missing ones are searched)
        run: |
          mkdir -p assets/downloaded/sounds
          if curl -fsSL -o /tmp/sp.zip "https://github.com/$GITHUB_REPOSITORY/releases/download/ragini-ci/sounds_pack.zip"; then
            unzip -oq /tmp/sp.zip -d assets/downloaded && echo "previous sound pack: $(ls assets/downloaded/sounds | wc -l) files"
          fi
          count() { python3 -c "import json,os;p='assets/downloaded/sounds/manifest_v2.json';print(len(json.load(open(p))) if os.path.exists(p) else 0)"; }
          before=$(count)
          timeout 36m python3 -u tools/fetch_assets.py sounds assets/downloaded > build/sounds_log.txt 2>&1 || true
          grep -E "^sound |STEP|Traceback|429|openverse" build/sounds_log.txt | head -80 || true
          cat build/sounds_report.txt 2>/dev/null || true
          after=$(count)
          echo "recorded sounds: $before -> $after"
          (cd assets/downloaded && zip -qr ../../build/sounds_pack.zip sounds)
          if [ "$after" -gt "$before" ]; then gh release upload ragini-ci build/sounds_pack.zip -R "$GITHUB_REPOSITORY" --clobber; fi
          ls assets/downloaded/sounds
      - name: Publish logs
        if: always()
        run: |
          cd build
          for f in assets_log.txt sounds_log.txt sounds_report.txt textures_contact.jpg textures_chosen.json CREDITS_AUTO.md; do
            [ -f "$f" ] && gh release upload ragini-ci "$f" -R "$GITHUB_REPOSITORY" --clobber || true
          done
          cd .. && zip -qr build/assets_downloaded.zip assets/downloaded -x "*/nor.jpg" "*/rough.jpg" "*/ao.jpg" && gh release upload ragini-ci build/assets_downloaded.zip -R "$GITHUB_REPOSITORY" --clobber || true
      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: |
            assets/downloaded
            build/CREDITS_AUTO.md
          if-no-files-found: warn

  # ----------------------------------------------------------------------------------------- Ragini, built in Blender
  ragini_model:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Model cache (rebuilt only when the Blender scripts change)
        id: mcache
        uses: actions/cache@v4
        with:
          path: build/ragini
          key: ragini-model-v1-${{ hashFiles('tools/common/**', 'tools/ragini/**', 'tools/install_blender.sh') }}
      - name: Blender cache
        if: steps.mcache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Install Blender
        if: steps.mcache.outputs.cache-hit != 'true'
        run: bash tools/install_blender.sh
      - name: Build Ragini in Blender
        if: steps.mcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/ragini
          set +e
          ~/blender/blender -b -noaudio -P tools/ragini/build_ragini.py -- build/ragini > build/ragini_blender.txt 2>&1
          code=$?
          set -e
          grep -E "^\[|Error|Traceback|FAILED|line [0-9]+" build/ragini_blender.txt | tail -150 || true
          ls -la build/ragini
          [ $code -eq 0 ] && [ -f build/ragini/ragini.glb ]
      - name: Publish logs and previews
        if: always()
        run: |
          cd build
          [ -f ragini/build_log.txt ] && cp ragini/build_log.txt ragini_build_log.txt
          (cd ragini && zip -q ../ragini_model.zip ragini.glb ragini_meta.json) || true
          for f in ragini_blender.txt ragini_build_log.txt ragini/preview_*.png ragini_model.zip; do
            [ -f "$f" ] && gh release upload ragini-ci "$f" -R "$GITHUB_REPOSITORY" --clobber || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ragini-model
          path: |
            build/ragini/ragini.glb
            build/ragini/ragini_meta.json
            build/ragini/ragini.blend
            build/ragini/preview_*.png

  # ----------------------------------------------------------------------------------------- the school, built in Blender
  school_model:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Model cache (rebuilt only when the Blender scripts change)
        id: mcache
        uses: actions/cache@v4
        with:
          path: build/school
          key: school-model-v1-${{ hashFiles('tools/common/**', 'tools/school/**', 'tools/install_blender.sh') }}
      - name: Blender cache
        if: steps.mcache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Install Blender
        if: steps.mcache.outputs.cache-hit != 'true'
        run: bash tools/install_blender.sh
      - name: Build the school in Blender (geometry, baked night lighting)
        if: steps.mcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/school
          set +e
          ~/blender/blender -b -noaudio -P tools/school/build_school.py -- build/school > build/school_blender.txt 2>&1
          code=$?
          set -e
          grep -E "^\[|Error|Traceback|FAILED|line [0-9]+" build/school_blender.txt | tail -150 || true
          [ $code -eq 0 ] && [ -f build/school/school.glb ]
      - name: Publish logs and previews
        if: always()
        run: |
          gh release view ragini-ci -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || sleep 60
          cd build
          [ -f school/build_log.txt ] && cp school/build_log.txt school_build_log.txt
          (cd school && zip -qr ../school_model.zip school.glb school_meta.json lightmaps) || true
          for f in school_blender.txt school_build_log.txt school/preview_*.png school_model.zip; do
            [ -f "$f" ] && gh release upload ragini-ci "$f" -R "$GITHUB_REPOSITORY" --clobber || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: school-model
          path: |
            build/school/school.glb
            build/school/school_meta.json
            build/school/lightmaps
            build/school/school.blend
            build/school/preview_*.png

  # ----------------------------------------------------------------------------------------- Godot: import and export the APK
  apk:
    needs: [assets, ragini_model, school_model]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: assets, path: . }
      - uses: actions/download-artifact@v4
        with: { name: ragini-model, path: build/ragini }
      - uses: actions/download-artifact@v4
        with: { name: school-model, path: build/school }
      - name: Put the models in the project
        run: |
          mkdir -p assets/models
          cp build/ragini/ragini.glb assets/models/
          cp build/school/school.glb build/school/school_meta.json assets/models/
          cp -r build/school/lightmaps assets/models/
          for f in assets/models/lightmaps/*.png; do
            printf '[remap]\n\nimporter="texture"\ntype="CompressedTexture2D"\n\n[params]\n\ncompress/mode=0\nmipmaps/generate=false\n' > "$f.import"
          done
          ls -la assets/models; ls assets/downloaded/sounds | wc -l
      - name: Godot cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-stable
      - name: Install Godot and export templates
        run: |
          V=$GODOT_VERSION
          mkdir -p ~/godot && cd ~/godot
          if [ ! -x godot ]; then
            curl -fsSL --retry 3 -o g.zip https://github.com/godotengine/godot/releases/download/$V-stable/Godot_v$V-stable_linux.x86_64.zip
            unzip -q g.zip && mv Godot_v$V-stable_linux.x86_64 godot && rm g.zip
          fi
          if [ ! -d templates ]; then
            curl -fsSL --retry 3 -o t.tpz https://github.com/godotengine/godot/releases/download/$V-stable/Godot_v$V-stable_export_templates.tpz
            unzip -q t.tpz && rm t.tpz
          fi
          mkdir -p ~/.local/share/godot/export_templates/$V.stable
          cp templates/android_*.apk templates/version.txt ~/.local/share/godot/export_templates/$V.stable/ 2>/dev/null || cp -r templates/* ~/.local/share/godot/export_templates/$V.stable/
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT" "$JAVA_HOME_17_X64" > ~/.config/godot/editor_settings-4.3.tres
          ~/godot/godot --version
      - name: Import and export
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/tools/ragini.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ragini
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ragini123
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/tools/ragini.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ragini
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ragini123
        run: |
          timeout 900 ~/godot/godot --headless --path . --import > build/import_log.txt 2>&1 || true
          grep -E "ERROR|SCRIPT ERROR" build/import_log.txt | head -40 || true
          timeout 900 ~/godot/godot --headless --path . --export-release Android build/Ragini.apk > build/export_log.txt 2>&1 || true
          tail -40 build/export_log.txt
          ls -la build/Ragini.apk
      - name: Publish the game
        run: |
          TAG="ragini-v${{ github.run_number }}"
          cat > build/CREDITS.md << 'EOT'
          # RAGINI - The Indian Horror Game
          Game by MXYAN GAMES OFFICIAL. All 3D models (Ragini, the school, furniture, items) were built in Blender
          by the scripts in this repository (`tools/`). The .blend files are attached.

          Real photographed textures, recorded sounds and fonts used:
          EOT
          cat build/CREDITS_AUTO.md >> build/CREDITS.md || true
          cat assets/downloaded/sounds/CREDITS_SOUNDS.md >> build/CREDITS.md 2>/dev/null || true
          cp build/ragini/ragini.blend build/ragini_character.blend || true
          cp build/school/school.blend build/ragini_school.blend || true
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "RAGINI - The Indian Horror Game (build ${{ github.run_number }})" \
            --notes "Download **Ragini.apk** and install it on Android (64-bit). Escape the school in 3 days: find the hammer for the planks and the main door key. Real recorded sound effects and music. Models built in Blender (.blend files attached)." \
            build/Ragini.apk build/CREDITS.md build/ragini_character.blend build/ragini_school.blend
          gh release upload ragini-ci build/import_log.txt build/export_log.txt -R "$GITHUB_REPOSITORY" --clobber || true
