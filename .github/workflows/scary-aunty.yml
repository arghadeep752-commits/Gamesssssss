name: Scary Aunty APK

on:
  push:
    branches: [ scary-aunty ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scary-aunty-build
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Get the project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install requests pillow numpy

      - name: Cache downloaded assets
        uses: actions/cache@v4
        with:
          path: ~/.cache/scary_aunty_assets
          key: assets-${{ hashFiles('ci/fetch_assets.py', 'ci/sketchfab_models.json', 'ci/models.lock.json') }}
          restore-keys: assets-

      - name: Download real assets (font, textures, sounds, music, Sketchfab models)
        env:
          SKETCHFAB_API_TOKEN: ${{ secrets.SKETCHFAB_API_TOKEN }}
        run: python ci/fetch_assets.py

      - name: Remember the chosen Sketchfab models (same models next build)
        run: |
          if [ -n "$(git status --porcelain ci/models.lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci/models.lock.json
            git commit -m "Lock Sketchfab model choices [skip ci]"
            git push || echo "Could not push the lock file (not a problem)."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot ${{ env.GODOT_VERSION }} and export templates
        run: |
          set -e
          V=${GODOT_VERSION}
          cd "$RUNNER_TEMP"
          wget -q "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${V}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${V}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${V}.stable"
          unzip -q "Godot_v${V}-stable_export_templates.tpz" 'templates/android_*.apk' 'templates/version.txt'
          mv templates/* "$HOME/.local/share/godot/export_templates/${V}.stable/"
          godot --version

      - name: Editor settings (Android SDK, Java, signing key)
        run: |
          set -e
          mkdir -p "$HOME/.config/godot"
          KS="$GITHUB_WORKSPACE/ci/debug.keystore"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          for NAME in editor_settings-4.tres editor_settings-4.6.tres; do
          cat > "$HOME/.config/godot/$NAME" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KS"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          sed -i 's/^ *//' "$HOME"/.config/godot/editor_settings-4*.tres
          cat "$HOME/.config/godot/editor_settings-4.6.tres"
          mkdir -p build
          touch build/.gdignore

      - name: Import the project
        run: |
          if godot --help 2>/dev/null | grep -q -- "--import"; then
            timeout 900 godot --headless --import 2>&1 | tail -n 80 || true
          fi
          timeout 600 godot --headless --editor --quit 2>&1 | tail -n 40 || true

      - name: Test run (looks for script errors)
        run: |
          timeout 150 godot --headless --quit-after 1500 res://scenes/game.tscn > build/smoke_game.log 2>&1 || true
          timeout 60 godot --headless --quit-after 300 res://scenes/main_menu.tscn > build/smoke_menu.log 2>&1 || true
          cat build/smoke_menu.log build/smoke_game.log | grep -E "SCRIPT ERROR|Parse Error|Invalid (call|get|set|access|operands)|Nonexistent function|Cannot call|Identifier .* not declared|at: .*\.gd" | sort | uniq -c | head -n 60 > build/smoke_errors.txt || true
          echo "---- errors found in test run ----"
          cat build/smoke_errors.txt
          while read -r line; do echo "::warning title=Game script problem::$line"; done < build/smoke_errors.txt
          if grep -q SCARY_AUNTY_READY build/smoke_game.log; then grep SCARY_AUNTY_READY build/smoke_game.log; echo "GAME STARTED OK" > build/smoke_ok.txt; else echo "::warning title=Game test::The game scene did not report that it started"; fi
          echo "---- end of game log ----"
          tail -n 60 build/smoke_game.log

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/ci/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/ci/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.${{ github.run_number }}\"/" export_presets.cfg
          godot --headless --export-release "Android" build/ScaryAunty.apk 2>&1 | tail -n 80
          ls -la build
          test -s build/ScaryAunty.apk

      - name: Write release notes
        run: |
          python - <<'EOF'
          import json, os
          r = json.load(open("build/asset_report.json"))
          errs = open("build/smoke_errors.txt").read().strip() if os.path.exists("build/smoke_errors.txt") else ""
          size = os.path.getsize("build/ScaryAunty.apk") / 1048576
          L = []
          L.append("## Scary Aunty - build %s" % os.environ.get("GITHUB_RUN_NUMBER", "?"))
          L.append("")
          L.append("Download **ScaryAunty.apk** below (%.0f MB), open it on your phone and allow installing." % size)
          L.append("If Android says *App not installed*, uninstall the old Scary Aunty first.")
          L.append("")
          L.append("### What is inside")
          L.append("- Font: %s" % (r.get("font") or "default font (download failed)"))
          for k, v in r.get("textures", {}).items():
              L.append("- Texture %s: %s" % (k, v))
          snd = r.get("sounds", {})
          L.append("- Real sounds: %d of %d found (Kenney, CC0)" % (sum(1 for v in snd.values() if v), len(snd)))
          for k, v in r.get("music", {}).items():
              L.append("- Music %s: %s (Kevin MacLeod, CC-BY 4.0)" % (k, v))
          m = r.get("models", {})
          if m:
              L.append("- Sketchfab models: %d" % len(m))
              for k, v in m.items():
                  L.append("  - %s: %s" % (k, v))
          else:
              L.append("- Sketchfab models: none yet - add the SKETCHFAB_API_TOKEN secret and run the build again")
          if r.get("notes"):
              L.append("")
              L.append("### Notes")
              for n in r["notes"]:
                  L.append("- %s" % n)
          L.append("")
          started = os.path.exists("build/smoke_ok.txt")
          L.append("Test run: %s, %s" % ("the game started" if started else "game start not confirmed", "no script errors found" if not errs else "some script warnings (see the build log)"))
          open("build/release_notes.md", "w").write("\n".join(L) + "\n")
          print("\n".join(L))
          EOF

      - name: Upload APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ScaryAunty-apk
          path: |
            build/ScaryAunty.apk
            build/*.log
            build/smoke_errors.txt
            build/asset_report.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scary-aunty-build-${{ github.run_number }}
          name: Scary Aunty (build ${{ github.run_number }})
          body_path: build/release_notes.md
          files: build/ScaryAunty.apk
          target_commitish: ${{ github.sha }}
          make_latest: true
