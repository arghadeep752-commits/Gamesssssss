<style>
/* Layout: product chat shell. Sign-in page is a two-pane split on desktop (product preview | form),
   a single column on phones. The app is a sidebar of chats plus a 768px conversation column.
   Neutral palette; the only colour is the saffron line of the Vaishnava tilak in the logo mark. */
:root {
  --bg: #FFFFFF;
  --side: #F7F7F8;
  --pane: #F3F3F5;
  --surface: #FFFFFF;
  --raised: #F2F2F4;
  --line: #E6E6EA;
  --line-strong: #D3D3DA;
  --fg: #0E0F13;
  --fg-2: #383B44;
  --muted: #6C6F7B;
  --faint: #9EA1AB;
  --accent: #2F45C5;
  --accent-soft: rgba(47, 69, 197, 0.08);
  --accent-line: rgba(47, 69, 197, 0.32);
  --saffron: #FE7D02;
  --btn: #0E0F13;
  --on-btn: #FFFFFF;
  --hover: rgba(14, 15, 19, 0.045);
  --press: rgba(14, 15, 19, 0.08);
  --item-on: rgba(14, 15, 19, 0.065);
  --ring: rgba(47, 69, 197, 0.18);
  --code-bg: #0F1117;
  --code-head: #181A22;
  --code-fg: #E3E5EC;
  --code-muted: #9396A3;
  --code-hover: rgba(227, 229, 236, 0.1);
  --hl-kw: #FF9F7A;
  --hl-str: #A5D6A7;
  --hl-num: #F8C77E;
  --hl-fn: #8FB4FF;
  --hl-com: #6F7383;
  --hl-type: #7FD3E3;
  --hl-attr: #C9A7FF;
  --danger: #C4291C;
  --on-danger: #FFFFFF;
  --danger-bg: #FEF2F1;
  --danger-line: #F5C9C4;
  --ok-bg: #F1F6F2;
  --ok-line: #CFE3D3;
  --toast-bg: #0E0F13;
  --toast-fg: #FFFFFF;
  --scrim: rgba(14, 15, 19, 0.35);
  --shadow-sm: 0 1px 2px rgba(14, 15, 19, 0.05);
  --shadow: 0 12px 32px rgba(14, 15, 19, 0.1), 0 2px 6px rgba(14, 15, 19, 0.05);
  --shadow-composer: 0 6px 24px rgba(14, 15, 19, 0.06);
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --f-body: "Geist", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1013;
    --side: #151619;
    --pane: #141518;
    --surface: #1A1B1F;
    --raised: #24252A;
    --line: #2A2B31;
    --line-strong: #3A3C44;
    --fg: #ECEDF0;
    --fg-2: #C6C8CF;
    --muted: #8F929C;
    --faint: #686B75;
    --accent: #93A4FF;
    --accent-soft: rgba(147, 164, 255, 0.12);
    --accent-line: rgba(147, 164, 255, 0.4);
    --saffron: #FF8A24;
    --btn: #ECEDF0;
    --on-btn: #0F1013;
    --hover: rgba(255, 255, 255, 0.05);
    --press: rgba(255, 255, 255, 0.09);
    --item-on: rgba(255, 255, 255, 0.07);
    --ring: rgba(147, 164, 255, 0.24);
    --code-bg: #0B0C0F;
    --code-head: #16171B;
    --danger: #FF8A7D;
    --on-danger: #2A0703;
    --danger-bg: #2A1416;
    --danger-line: #5B2B2D;
    --ok-bg: #15231A;
    --ok-line: #2B4733;
    --toast-bg: #ECEDF0;
    --toast-fg: #0F1013;
    --scrim: rgba(0, 0, 0, 0.55);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow: 0 14px 36px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.3);
    --shadow-composer: 0 6px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.6 var(--f-body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
#root { height: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
input, textarea { font: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.mark { display: block; flex: none; }
.mark-v { fill: currentColor; }
.mark-tilak { fill: var(--saffron); }
.center { height: 100%; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }
.splash .mark { color: var(--fg); animation: breathe 1.6s ease-in-out infinite; }
.hello-mark { color: var(--fg); margin-bottom: 18px; animation: fadeUp 0.5s var(--ease) both; }

/* ---------- Sign in ---------- */
.auth { height: 100%; overflow-y: auto; display: grid; grid-template-columns: minmax(0, 1fr); }
.pane { display: none; }
.formside {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 20px 24px;
}
.formside .topbar { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
.formwrap { flex: 1; display: flex; align-items: center; justify-content: center; padding-block: 28px; }
.card { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 18px; animation: fadeUp 0.45s var(--ease) both; }
.card h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.2; text-wrap: balance; }
.card .sub { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.gbtn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  height: 46px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  border-radius: 12px;
  font-size: 15px;
  font-weight: 500;

  // Answer in progress: status while thinking or searching, then a smooth character-by-character reveal.
  function Pending({ text, phase, query, sources, m, startedAt, revealRef, onGrow }) {
    const [shown, setShown] = useState(0);
    const [now, setNow] = useState(Date.now());
    const targetRef = useRef(text);
    targetRef.current = text;
    const shownRef = useRef(0);

    useEffect(() => {
      if (phase === "streaming") return;
      const t = setInterval(() => setNow(Date.now()), 1000);
      return () => clearInterval(t);
    }, [phase]);

    useEffect(() => {
      let raf = 0;
      let last = 0;
      const tick = (ts) => {
        const goal = targetRef.current.length;
        if (shownRef.current > goal) {
          shownRef.current = goal;
          revealRef.current = goal;
          setShown(goal);
        } else if (shownRef.current < goal) {
          const backlog = goal - shownRef.current;
          shownRef.current = reduceMotion ? goal : Math.min(goal, shownRef.current + Math.max(2, Math.ceil(backlog / 9)));
          revealRef.current = shownRef.current;
          if (ts - last > 32 || shownRef.current >= goal) { last = ts; setShown(shownRef.current); }
        }
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(raf);
    }, []);

    useLayoutEffect(() => { onGrow(); }, [shown, phase, query]);

    let visible = text.slice(0, shown).replace(/^\s+/, "");
    if (sources && sources.length) visible = visible.replace(/[ \t]*(?:\[\^?[\d,， ]{0,8}|【\d{0,2}[^】]{0,40})$/, ""); // hide a citation that is still arriving
    const body = useMemo(() => linkCitations(renderMd(visible, false), sources), [visible, sources]);
    const secs = Math.max(0, Math.floor((now - startedAt) / 1000));
    const showStatus = phase !== "streaming" || !visible;
    const searching = phase === "searching";

    return html`<div className="a streaming enter" aria-live="polite">
      ${showStatus
        ? html`<div className="thinking">
            ${searching ? html`<span className="globe"><${Icon} n="globe" s=${19} /></span>` : html`<${Mark} size=${20} />`}
            <span className="shimmer">${searching ? "Searching the web" : m.verb}</span>
            ${searching && query
              ? html`<span className="query">“${query}”</span>`
              : secs >= 2 ? html`<span className="secs">${secs}s</span>` : null}
          </div>`
        : null}
      ${visible ? html`<div className="md" dangerouslySetInnerHTML=${{ __html: body }}></div>` : null}
    </div>`;
  }

    // ----- chat history from your Supabase account -----
    useEffect(() => {
      let dead = false;
      (async () => {
        let map = {};
        try {
          const { data, error: err } = await sb.from("chats").select("id,title,messages,created_at,updated_at").order("updated_at", { ascending: false }).limit(200);
          if (err) throw err;
          (data || []).forEach((r) => {
            map[r.id] = { id: r.id, title: r.title, messages: Array.isArray(r.messages) ? r.messages : [], createdAt: Date.parse(r.created_at) || Date.now(), updatedAt: Date.parse(r.updated_at) || Date.now() };
          });

          if (!dead) setStoreMode("local");
          const arr = lsGet(LS_LOCAL, []);
          (Array.isArray(arr) ? arr : []).forEach((c) => { if (c && c.id && Array.isArray(c.messages)) map[c.id] = c; });
        }
        if (dead) return;
        setChats(map);
        const last = lsGet(LS_ACTIVE, null);
        if (last && map[last]) setActiveId(last);
        setLoaded(true);
      })();
      return () => { dead = true; };
    }, []);

    function persist(c) {
      if (modeRef.current !== "cloud") return;
      const row = { id: c.id, title: c.title, messages: fitMessages(c.messages), created_at: new Date(c.createdAt).toISOString(), updated_at: new Date(c.updatedAt).toISOString() };
      const prev = queueRef.current.get(c.id) || Promise.resolve();
      const p = prev.catch(() => {}).then(async () => {
        if (deletedRef.current.has(c.id)) return;
        const { error: err } = await sb.from("chats").upsert(row);
        if (err) throw err;
      });
      queueRef.current.set(c.id, p);
      p.catch((e) => { console.warn("Save failed", e); setNote("This chat couldn't be saved to your account. Check your connection."); });
    }
    function removeRemote(ids) {
      if (modeRef.current !== "cloud" || !ids.length) return;
      for (let i = 0; i < ids.length; i += 100) {
        const chunk = ids.slice(i, i + 100);
        Promise.all(chunk.map((id) => (queueRef.current.get(id) || Promise.resolve()).catch(() => {})))

          .then((r) => { if (r && r.error) throw r.error; })
          .catch((e) => console.warn("Delete failed", e));
      }
    }

    function commit(c) {
      setChats((prev) => Object.assign({}, prev, { [c.id]: c }));
      persist(c);

    function removeChat(id) {
      if (busy && busy.chatId === id && ctlRef.current) ctlRef.current.abort();

      if (ctlRef.current) ctlRef.current.abort();

      setError(null);

      if (deletedRef.current.has(c.id)) return;

    function waitReveal(len) {
      return new Promise((resolve) => {
        if (reduceMotion) return resolve();
        const t0 = Date.now();
        const check = () => {
          if (revealRef.current >= len || Date.now() - t0 > 1400) resolve();
          else requestAnimationFrame(check);
        };
        requestAnimationFrame(check);
      });

    function historyFor(list) {

        .filter((x) => (x.content && x.content.trim()) || x.images)

          let content = x.role === "assistant" ? copyText(x.content || "", x.sources) : x.content || "";

          if (!content.trim()) content = "Describe this image.";
          return { role: x.role, content: content };
        });

    // ----- ask Vishnu AI (streams from your Supabase function) -----
    async function run(c) {
      setError(null);
      setEditing(null);
      const ctl = new AbortController();
      ctlRef.current = ctl;
      stick.current = true;
      revealRef.current = 0;

      const update = (patch) => setBusy((b) => (b && b.chatId === c.id ? Object.assign({}, b, patch) : b));
      const dropPreamble = () => {
        if (acc.seg && acc.seg.length < 400) acc.text = acc.text.slice(0, acc.text.length - acc.seg.length);
        acc.seg = "";
      };
      let failure = null;
      try {
        const { data } = await sb.auth.getSession();
        const session = data && data.session;
        if (!session) throw { code: "session", message: "Your session has expired. Sign in again to continue." };
        const last = c.messages[c.messages.length - 1];
        const imgs = (last && imagesRef.current.get(last.id)) || [];
        const res = await fetch(FN_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token, apikey: CONFIG.SUPABASE_KEY },
          body: JSON.stringify({ model: mdl.id, search: searchRef.current, timezone: TZ, messages: historyFor(c.messages), images: imgs.map((x) => ({ media_type: x.media_type, data: x.data })) }),
          signal: ctl.signal,
        });
        if (!res.ok || !res.body) {
          let j = {};
          try { j = await res.json(); } catch (e) {}
          throw { code: j.code || "http_" + res.status, message: j.message || (res.status === 404 ? "Vishnu AI's server function isn't deployed yet." : "Vishnu AI couldn't answer right now. Try again in a moment.") };
        }
        await readEvents(res.body, (ev) => {
          if (ev.t === "status" && ev.s === "searching") { dropPreamble(); update({ phase: "searching", text: acc.text }); }
          else if (ev.t === "status" && ev.s === "thinking") { if (!acc.text) update({ phase: "thinking" }); }
          else if (ev.t === "search") { acc.queries.push(ev.q); update({ phase: "searching", query: ev.q, text: acc.text }); }
          else if (ev.t === "results") {
            (ev.items || []).forEach((it) => {
              if (it && typeof it.url === "string" && /^https?:\/\//i.test(it.url)) {
                acc.results.push({ n: Number(it.n) || acc.results.length + 1, url: it.url, title: String(it.title || "").slice(0, 200) });
              }
            });
            update({ sources: acc.results.slice() });
          }
          else if (ev.t === "text") { acc.text += ev.d; acc.seg += ev.d; update({ phase: "streaming", text: acc.text }); }
          else if (ev.t === "done") { acc.done = true; acc.truncated = !!ev.truncated; }
          else if (ev.t === "error") { failure = { code: ev.code, message: ev.message }; if (ev.detail) console.warn("Vishnu AI:", ev.detail); }
        });
        if (!acc.done && !failure) failure = { code: "network", message: "The connection dropped before the answer finished. Try again." };
      } catch (e) {
        if (e && e.name === "AbortError") failure = { code: "cancelled" };
        else if (e && e.code) failure = { code: e.code, message: e.message };
        else failure = { code: "network", message: "Couldn't reach Vishnu AI. Check your connection and try again." };
      }
      const text = acc.text.replace(/^\s+/, "");
      if (text) {
        const sources = acc.results.slice(0, 20);
        const meta = { model: mdl.id };
        if (acc.queries.length) meta.searches = acc.queries.length;
        if (sources.length) meta.sources = sources;
        if (failure && failure.code === "cancelled") meta.stopped = true;
        else if (failure) meta.interrupted = true;
        else if (acc.truncated) meta.truncated = true;
        await waitReveal(acc.text.length);
        finish(c, text, meta);
      }
      if (!text && !failure) {
        failure = acc.truncated
          ? { code: "empty", message: "Vishnu AI ran out of room before it could answer. Try again, or ask a shorter question." }
          : { code: "empty", message: "Vishnu AI didn't return an answer. Try again." };
      }
      if (failure && failure.code !== "cancelled") setError({ chatId: c.id, code: failure.code, message: failure.message });
      if (ctlRef.current === ctl) ctlRef.current = null;
      setBusy(null);
    }

    function send(textArg) {
      const text = String(textArg != null ? textArg : draft).trim();
      const files = textArg != null ? [] : atts;
      if ((!text && !files.length) || busy || !loaded) return;
      const now = Date.now();
      let c = chat || { id: uid(), title: makeTitle(text || "Image"), createdAt: now, updatedAt: now, messages: [] };
      const userMsg = { id: uid(), role: "user", content: text };
      if (files.length) {
        userMsg.images = files.length;
        imagesRef.current.set(userMsg.id, files);
        thumbsRef.current.set(userMsg.id, files.map((a) => a.url));
      }
      freshRef.current.add(userMsg.id);
      c = Object.assign({}, c, { updatedAt: now, messages: c.messages.concat([userMsg]) });
      commit(c);
      setActiveId(c.id);
      setDraft("");
      setAtts([]);
      run(c);
    }
    function rerun(c) {
      if (!c || busy) return;
      let list = c.messages;
      if (list.length && list[list.length - 1].role === "assistant") list = list.slice(0, -1);
      if (!list.length || list[list.length - 1].role !== "user") { setError(null); return; }
      const next = Object.assign({}, c, { messages: list, updatedAt: Date.now() });
      commit(next);
      run(next);
    }
    function saveEdit() {
      if (!editing || !chat || busy) return;
      const text = editing.text.trim();
      if (!text) return;
      const idx = chat.messages.findIndex((x) => x.id === editing.id);
      if (idx < 0) { setEditing(null); return; }
      const old = chat.messages[idx];
      const msg = Object.assign({}, old, { id: uid(), content: text });
      if (imagesRef.current.has(old.id)) imagesRef.current.set(msg.id, imagesRef.current.get(old.id));
      if (thumbsRef.current.has(old.id)) thumbsRef.current.set(msg.id, thumbsRef.current.get(old.id));
      const next = Object.assign({}, chat, { updatedAt: Date.now(), title: idx === 0 ? makeTitle(text) : chat.title, messages: chat.messages.slice(0, idx).concat([msg]) });
      setEditing(null);
      commit(next);
      run(next);
    }
    function stop() { if (ctlRef.current) ctlRef.current.abort(); }
    function newChat() {
      setActiveId(null);
      setOpen(false);
      setConfirmId(null);
      setError(null);
      setEditing(null);
      if (!coarse && taRef.current) setTimeout(() => taRef.current && taRef.current.focus(), 0);
    }
    function selectChat(id) {
      stick.current = true;
      setActiveId(id);
      setOpen(false);
      setConfirmId(null);
      setEditing(null);
    }
    async function signOut() {
      if (ctlRef.current) ctlRef.current.abort();
      try { await sb.auth.signOut(); } catch (e) {}
    }

    function copyMsg(m) {
      const fail = () => showToast("Copy isn't available here. Select the text instead.");
      try {
        const p = navigator.clipboard && navigator.clipboard.writeText(copyText(m.content, m.sources));
        if (p && p.then) p.then(() => {
          setCopied(m.id);
          showToast("Copied");
          setTimeout(() => setCopied((x) => (x === m.id ? null : x)), 1600);
        }, fail);
        else fail();
      } catch (e) { fail(); }
    }
    function onThreadClick(e) {
      const b = e.target.closest && e.target.closest("[data-copy-code]");
      if (!b) return;
      const box = b.closest(".code");
      const code = box && box.querySelector("code");
      if (!code) return;
      const label = b.querySelector("span");
      const select = () => {
        const r = document.createRange();
        r.selectNodeContents(code);
        const s = window.getSelection();
        s.removeAllRanges();
        s.addRange(r);
      };
      try {
        const p = navigator.clipboard && navigator.clipboard.writeText(code.textContent);
        if (p && p.then) p.then(() => { if (label) { label.textContent = "Copied"; setTimeout(() => { label.textContent = "Copy"; }, 1600); } }, select);
        else select();
      } catch (err) { select(); }
    }

    async function addFiles(list) {
      const all = Array.from(list || []);
      const files = all.filter((f) => /^image\/(jpeg|png|webp|gif)$/.test(f.type));
      if (!files.length) { if (all.length) showToast("Use JPEG, PNG, WebP or GIF images"); return; }
      const room = Math.max(0, 4 - atts.length);
      if (files.length > room) showToast("You can attach up to 4 images");
      const ready = [];
      for (const f of files.slice(0, room)) {
        try { ready.push(await prepareImage(f)); } catch (e) { showToast("One image couldn't be read"); }
      }
      if (ready.length) setAtts((a) => a.concat(ready).slice(0, 4));
    }
    function onPaste(e) {
      if (!e.clipboardData) return;
      const files = Array.from(e.clipboardData.files || []).filter((f) => f.type.indexOf("image/") === 0);
      if (files.length) { e.preventDefault(); addFiles(files); }
    }

    function onScroll() {
      const el = scrollRef.current;
      if (!el) return;
      const near = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
      stick.current = near;
      setAtBottom(near);
      setScrolled(el.scrollTop > 4);
    }
    function follow() {
      const el = scrollRef.current;
      if (el && stick.current) el.scrollTop = el.scrollHeight;
    }
    useLayoutEffect(() => { follow(); }, [busy && busy.phase, msgs.length, activeId, error]);
    useEffect(() => { if (!chat) setScrolled(false); }, [chat]);
    function toBottom() {
      const el = scrollRef.current;
      if (!el) return;
      stick.current = true;
      setAtBottom(true);
      el.scrollTo({ top: el.scrollHeight, behavior: reduceMotion ? "auto" : "smooth" });
    }

    useLayoutEffect(() => {
      const ta = taRef.current;
      if (!ta) return;
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 220) + "px";
    }, [draft]);
    useEffect(() => { if (!coarse && taRef.current) taRef.current.focus(); }, []);
    useEffect(() => {
      const onKey = (e) => { if (e.key === "Escape") { setMenu(false); setOpen(false); setConfirmId(null); setSettings(false); } };
      window.addEventListener("keydown", onKey);
      return () => window.removeEventListener("keydown", onKey);
    }, []);
    function onKeyDown(e) {
      if (e.key === "Enter" && !e.shiftKey && !coarse && !(e.nativeEvent && e.nativeEvent.isComposing)) { e.preventDefault(); send(); }
    }

    const groups = useMemo(() => {
      const q = query.trim().toLowerCase();
      const list = Object.values(chats)
        .filter((c) => !q || (c.title || "").toLowerCase().indexOf(q) !== -1 || c.messages.some((m) => (m.content || "").toLowerCase().indexOf(q) !== -1))
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      const out = [];
      list.forEach((c) => {
        const label = groupLabel(c.updatedAt || c.createdAt || Date.now());
        const g = out.length && out[out.length - 1].label === label ? out[out.length - 1] : null;
        if (g) g.items.push(c); else out.push({ label: label, items: [c] });
      });
      return out;
    }, [chats, query]);

    const current = modelOf(model);
    const canSend = loaded && !busy && (draft.trim() || atts.length);
    const showErr = error && chat && error.chatId === chat.id;
    const suggestions = SUGGESTIONS[current.id] || SUGGESTIONS.ananta;
    const chatCount = Object.keys(chats).length;

    return html`<div className=${"app" + (open ? " open" : "") + (collapsed ? " collapsed" : "")}>
      <aside className="side" aria-label="Chats">
        <div className="side-head">
          <div className="logo"><${Mark} size=${26} />Vishnu AI</div>
          <button type="button" className="iconbtn collapse" aria-label="Hide sidebar" title="Hide sidebar" onClick=${() => setCollapsed(true)}><${Icon} n="sidebar" /></button>
          <button type="button" className="iconbtn close" aria-label="Close sidebar" onClick=${() => setOpen(false)}><${Icon} n="x" /></button>
        </div>
        <div className="navs">
          <button type="button" className="nav-row" onClick=${newChat}><${Icon} n="compose" s=${18} />New chat</button>
          <label className="nav-row search">
            <${Icon} n="search" s=${18} />
            <input id="chat-search" type="search" placeholder="Search chats" value=${query} onChange=${(e) => setQuery(e.target.value)} aria-label="Search chats" />
          </label>
        </div>
        <nav className="list">
          ${!loaded
            ? html`<div className="emptylist">Loading your chats…</div>`
            : groups.length === 0
              ? html`<div className="emptylist">${query ? "No chats match that search." : "Your conversations will appear here."}</div>`
              : groups.map((g) => html`<div key=${g.label}>
                  <div className="group">${g.label}</div>
                  ${g.items.map((c) => confirmId === c.id
                    ? html`<div key=${c.id} className="item on"><div className="confirm">
                        <span>Delete chat?</span>
                        <button type="button" className="btn-sm" onClick=${() => setConfirmId(null)}>Cancel</button>
                        <button type="button" className="btn-sm danger" onClick=${() => removeChat(c.id)}>Delete</button>
                      </div></div>`
                    : html`<div key=${c.id} className=${"item" + (c.id === activeId ? " on" : "")}>
                        <button type="button" className="open" title=${c.title} onClick=${() => selectChat(c.id)}>${c.title || "New chat"}</button>
                        <button type="button" className="del" aria-label=${"Delete " + (c.title || "chat")} onClick=${() => setConfirmId(c.id)}><${Icon} n="trash" s=${16} /></button>
                      </div>`)}
                </div>`)}
        </nav>
        <button type="button" className="me" onClick=${() => { setSettings(true); setOpen(false); }}>
          <${Avatar} info=${info} />
          <span className="who"><b>${info.full}</b><span>${info.email}</span></span>
          <${Icon} n="settings" s=${18} />
        </button>
      </aside>
      <div className="scrim" onClick=${() => setOpen(false)}></div>

      <main className=${"main" + (chat ? "" : " empty")}>
        <header className=${"top" + (scrolled ? " scrolled" : "")}>
          <button type="button" className="iconbtn tg-mobile" aria-label="Open chats" onClick=${() => setOpen(true)}><${Icon} n="menu" /></button>
          <button type="button" className="iconbtn tg-desk" aria-label="Show sidebar" title="Show sidebar" onClick=${() => setCollapsed(false)}><${Icon} n="sidebar" /></button>
          <div className="modelwrap">
            <button type="button" className="model" aria-haspopup="true" aria-expanded=${menu} onClick=${() => setMenu((v) => !v)}>
              <span>${current.name}</span>
              <span className="chev"><${Icon} n="chev" s=${16} /></span>
            </button>
            ${menu ? html`<div className="pop-scrim" onClick=${() => setMenu(false)}></div>` : null}
            <div className=${"pop" + (menu ? " show" : "")} role="menu" aria-label="Choose a model">
              ${MODELS.map((m) => html`<button key=${m.id} type="button" role="menuitemradio" aria-checked=${m.id === model} className="opt" onClick=${() => { setModel(m.id); setMenu(false); }}>
                <span className="glyph"><${Icon} n=${m.glyph} s=${18} /></span>
                <span><b>${m.name}</b><small>${m.desc}</small></span>
                <span className="tick">${m.id === model ? html`<${Icon} n="check" s=${18} />` : null}</span>
              </button>`)}
            </div>
          </div>
          <div className="spacer"></div>
          <button type="button" className="iconbtn" aria-label="New chat" title="New chat" onClick=${newChat}><${Icon} n="compose" /></button>
        </header>

        <div className="stage">
          <div className="scroll" ref=${scrollRef} onScroll=${onScroll}>
            ${!chat
              ? html`<section className="hello">
                  <div className="hello-mark"><${Mark} size=${52} /></div>
                  <h1>${greeting(info.first)}</h1>
                  <p>${searchOn ? "Ask anything. Vishnu AI checks the live web for you." : "How can I help you today?"}</p>
                </section>`
              : html`<div className="thread" onClick=${onThreadClick}>
                  ${msgs.map((m, i) => m.role === "user"
                    ? html`<${UserMessage} key=${m.id} msg=${m} thumbs=${thumbsRef.current.get(m.id)} enter=${freshRef.current.has(m.id)}
                        editing=${editing && editing.id === m.id ? editing : null}
                        canEdit=${!busy}
                        onCopy=${copyMsg}
                        onEdit=${(x) => setEditing({ id: x.id, text: x.content })}
                        onEditChange=${(t) => setEditing((ed) => (ed ? { id: ed.id, text: t } : ed))}
                        onEditCancel=${() => setEditing(null)}
                        onEditSave=${saveEdit} />`
                    : html`<${AiMessage} key=${m.id} msg=${m} copied=${copied === m.id}
                        last=${i === msgs.length - 1 && !busyHere}
                        canRegen=${i === msgs.length - 1 && !busy}
                        onCopy=${copyMsg} onRegen=${() => rerun(chat)} />`)}
                  ${busyHere
                    ? html`<${Pending} key=${busy.key} text=${busy.text} phase=${busy.phase} query=${busy.query} sources=${busy.sources} m=${modelOf(busy.model)}
                        startedAt=${busy.startedAt} revealRef=${revealRef} onGrow=${follow} />`
                    : null}
                  ${showErr
                    ? html`<div className="err enter" role="alert">
                        <p>${error.message || "Something went wrong. Try again."}</p>
                        ${error.code === "session"
                          ? html`<button type="button" className="pill" onClick=${signOut}>Sign in again</button>`
                          : !NO_RETRY.has(error.code) ? html`<button type="button" className="pill" onClick=${() => rerun(chat)}>Try again</button>` : null}
                      </div>`
                    : null}
                </div>`}
          </div>

          <div className="dock">
            <button type="button" className=${"tobottom" + (chat && !atBottom ? " show" : "")} aria-label="Scroll to latest" onClick=${toBottom}><${Icon} n="down" s=${18} /></button>
            ${note ? html`<div className="note" role="status" onClick=${() => setNote("")}>${note}</div>` : null}
            <form className="composer" onSubmit=${(e) => { e.preventDefault(); send(); }}>
              ${atts.length ? html`<div className="atts">
                ${atts.map((a) => html`<div key=${a.id} className="att">
                  <img src=${a.url} alt="Image to send" />
                  <button type="button" aria-label="Remove image" onClick=${() => setAtts((l) => l.filter((x) => x.id !== a.id))}><${Icon} n="x" s=${12} w=${2.4} /></button>
                </div>`)}
              </div>` : null}
              <textarea id="message" ref=${taRef} rows="1" placeholder="Ask anything" aria-label=${"Message " + current.name}
                value=${draft} onChange=${(e) => setDraft(e.target.value)} onKeyDown=${onKeyDown} onPaste=${onPaste}></textarea>
              <div className="tools">
                <button type="button" className="iconbtn" aria-label="Add images" title="Add images" onClick=${() => fileRef.current && fileRef.current.click()}><${Icon} n="plus" /></button>
                <input id="image-input" ref=${fileRef} type="file" hidden multiple accept="image/jpeg,image/png,image/webp,image/gif"
                  onChange=${(e) => { addFiles(e.target.files); e.target.value = ""; }} />
                <button type="button" className=${"toggle" + (searchOn ? " on" : "")} aria-pressed=${searchOn}
                  title=${searchOn ? "Web search is on" : "Web search is off"} onClick=${() => setSearchOn((v) => !v)}>
                  <${Icon} n="globe" s=${16} /><span>Search</span>
                </button>
                <div className="spacer"></div>
                ${busy
                  ? html`<button type="button" className="send stop" aria-label="Stop answering" title="Stop" onClick=${stop}>
                      <svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><rect width="14" height="14" rx="2.5" fill="currentColor" /></svg>
                    </button>`
                  : html`<button type="submit" className="send" aria-label="Send message" disabled=${!canSend}><${Icon} n="up" s=${18} w=${2.2} /></button>`}
              </div>
            </form>
            ${!chat
              ? html`<div className="chips" key=${current.id}>
                  ${suggestions.map((s, i) => html`<button key=${s.t} type="button" className="chip" style=${{ "--i": i }} title=${s.p} disabled=${!!busy || !loaded} onClick=${() => send(s.p)}>
                    <${Icon} n=${s.icon} s=${16} />${s.t}
                  </button>`)}
                </div>`
              : null}
            <div className="fine">Vishnu AI can make mistakes. Check important info.</div>
          </div>
        </div>
      </main>

      ${settings
        ? html`<${Settings} info=${info} theme=${theme} onTheme=${setTheme} onClose=${() => setSettings(false)}
            onDeleteAll=${deleteAll} onSignOut=${signOut} chatCount=${chatCount} storeMode=${storeMode} />`
        : null}

      <div className=${"toast" + (toast.show ? " show" : "")} role="status" aria-live="polite">${toast.text}</div>
    </div>`;
  }

  // ---------- root: decides between sign-in and the app ----------
  function Root() {
    const [state, setState] = useState({ ready: false, session: null, recovery: false });
    const urlError = useMemo(readUrlError, []);
    useEffect(() => {
      let alive = true;
      const sub = sb.auth.onAuthStateChange((event, session) => {
        if (!alive) return;
        setState((s) => ({
          ready: true,
          session: session,
          recovery: event === "PASSWORD_RECOVERY" ? true : event === "SIGNED_OUT" ? false : s.recovery,
        }));
      });
      sb.auth.getSession().then((r) => {
        if (alive) setState((s) => (s.ready ? s : { ready: true, session: r.data.session, recovery: false }));
      }, () => { if (alive) setState((s) => (s.ready ? s : { ready: true, session: null, recovery: false })); });
      return () => { alive = false; sub.data.subscription.unsubscribe(); };
    }, []);

    if (!state.ready) return html`<div className="center splash"><${Mark} size=${60} /></div>`;
    if (state.recovery && state.session) return html`<${RecoveryScreen} onDone=${() => setState((s) => Object.assign({}, s, { recovery: false }))} />`;
    if (!state.session) return html`<${AuthScreen} initialError=${urlError} />`;
    return html`<${App} key=${state.session.user.id} user=${state.session.user} />`;
  }

  function boot() {
    sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    });
    ReactDOM.createRoot(document.getElementById("root")).render(html`<${Root} />`);
  }

  if (window.supabase && window.supabase.createClient) {
    boot();
  } else {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    s.onload = () => { if (window.supabase && window.supabase.createClient) boot(); else s.onerror(); };
    s.onerror = () => { document.getElementById("root").innerHTML = '<div class="center">Vishnu AI could not load its sign-in service. Check your internet connection and reload the page.</div>'; };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
